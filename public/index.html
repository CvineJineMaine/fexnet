<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FexNet</h1>
            <p>Сервіс для обміну файлів</p>
        </header>
            <main class="grid-container">
                <section class="card upload-section">
                    <h2>Завантажити файл</h2>
                    <form id="uploadForm" >
                        <div class="file-input-wrapper">
                            <input type="file" id="fileInput" name="file" required>
                            <label for="fileInput">Оберіть файл
                            <span id="fileName">Виберіть файл</span>

                            </label>
                        </div>
                        <button type="submit" class="downloadBtn">Завантажити</button>
                    </form>
                <div id="uploadResult" class="resultBox hidden">
                    <p id="uploadMessage">Файл успішно завантажено</p>
                    <div class="code-display">
                        <span id="generatedCode">--------</span>
                        <button id="copyBtn">Скопіювати</button>
                    </div>
                </div>
                </section>
                <section class="card download-section">
                    <h2>Завантажити файл</h2>
                    <form id="downloadForm">
                        <div class="input-group">
                            <input type="text" id="codeInput" placeholder="Введіть код файлу" required maxlength="6">
                            </div>
                            <button type="submit" class="btn downloadBtn">Завантажити</button>
                    </form>
                    <div id="downloadError" class="error-msg hidden"></div>
                </section>
            </main>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
